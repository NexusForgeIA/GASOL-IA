# Netlify (sitio gasol-ia, dirección oficial https://gasol-ia.netlify.app).
# Sin compilación: se publica la raíz del repositorio tal cual, desde la rama main.
[build]
  publish = "."

# Seguridad en todas las respuestas. El CSP de cada página sigue en su <meta>; esta cabecera solo
# añade lo que un <meta> no puede (frame-ancestors) y no restringe nada más, así que no lo rompe.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# El service worker nunca con caché larga: el navegador lo revalida en cada visita.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# Imágenes e iconos: un día. HTML, CSS y JS se quedan como los sirve Netlify (revalidar siempre),
# porque sus nombres no cambian entre versiones.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
